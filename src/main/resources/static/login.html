<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Prompter Backend</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-body: #0b1120;
            --bg-card: #1e293b;
            --border-subtle: rgba(148,163,184,.12);
            --border-focus: rgba(34,211,238,.5);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #22d3ee;
            --accent-hover: #06b6d4;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
            color: var(--text-primary);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            text-align: center;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-heading, #e2e8f0);
            margin-bottom: .3rem;
        }

        .login-subtitle {
            font-size: .9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .login-form { display: flex; flex-direction: column; gap: 1rem; }

        .login-field { text-align: left; }
        .login-field label {
            display: block;
            font-size: .82rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: .35rem;
        }
        .login-field input {
            width: 100%;
            padding: .6rem .75rem;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            font-size: .9rem;
            color: var(--text-primary);
            background: rgba(0,0,0,.25);
        }
        .login-field input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(34,211,238,.15);
        }

        .login-btn {
            padding: .65rem;
            background: var(--accent);
            color: #04121a;
            border: none;
            border-radius: 8px;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
            margin-top: .5rem;
        }
        .login-btn:hover { background: var(--accent-hover); }

        .login-error {
            background: rgba(239,68,68,.12);
            color: #fca5a5;
            padding: .5rem .75rem;
            border-radius: 8px;
            font-size: .85rem;
            display: none;
        }
        .login-error.visible { display: block; }

        .login-link {
            margin-top: 1.5rem;
            font-size: .82rem;
            color: var(--text-muted);
        }
        .login-link a { color: var(--accent); text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-title">Sign in</div>
    <p class="login-subtitle">Prompter backoffice</p>

    <div class="login-error" id="error"></div>

    <form class="login-form" action="/login" method="post">
        <div class="login-field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username">
        </div>
        <div class="login-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">Sign in</button>
    </form>

    <p class="login-link"><a href="/">← Back to site</a></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
        var err = document.getElementById('error');
        err.textContent = 'Invalid username or password.';
        err.classList.add('visible');
    }
    if (params.get('logout')) {
        var err = document.getElementById('error');
        err.style.background = 'rgba(34,197,94,.12)';
        err.style.color = '#86efac';
        err.textContent = 'You have been logged out.';
        err.classList.add('visible');
    }
</script>
</body>
</html>
